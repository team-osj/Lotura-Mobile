name: lotura
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리 라이브러리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # JSON 파싱 라이브러리
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 라우터
  go_router: ^14.8.1

  # 이미지 svg
  flutter_svg: ^2.0.17

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Icon
  material_symbols_icons: ^4.2808.1

  # Url Launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  freezed: ^3.0.3
  riverpod_generator: ^2.6.5
  source_gen: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/banner/
    - assets/image/device/
    - assets/image/logo/
    - assets/icon/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/font/pretendard_semibold.otf
          weight: 600
        - asset: assets/font/pretendard_medium.otf
          weight: 500
        - asset: assets/font/pretendard_regular.otf
          weight: 400
